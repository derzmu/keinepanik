# Copies the site to Hetzner. GitHub stays the repository; Hetzner is only the
# webserver, so there is nothing to build here either — rsync carries the same
# files the repository holds, minus everything in .deployignore.
name: deploy

on:
  push:
    branches: [main]

  # The gigs job commits with GITHUB_TOKEN, and commits made with that token raise
  # no push event — gigs.yml relies on exactly that so it cannot loop on its own
  # commit. Without this second trigger the hourly dates would keep updating in the
  # repository and quietly freeze on the server, with nothing failing to show it.
  workflow_run:
    workflows: [gigs]
    types: [completed]

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would change and transfer nothing'
        type: boolean
        default: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rsync:
    runs-on: ubuntu-latest
    # workflow_run fires on failure too. Only a green gigs run is worth shipping.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      # Always the current main, never the commit that happened to trigger this:
      # a workflow_run event carries the gigs run's context, not a deployable ref.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The same guard validate.yml runs. A stylesheet link pointing at a file that
      # no longer exists is cheap to catch here and expensive to catch on the server.
      - name: Design-system guard
        run: node tools/validate-tokens.mjs

      # An unset HETZNER_PATH would leave rsync with "user@host:", which resolves to
      # the login home directory — and --delete would then empty it. Fail instead.
      - name: Refuse to deploy without a target
        env:
          HOST: ${{ secrets.HETZNER_SSH_HOST }}
          USER_: ${{ secrets.HETZNER_SSH_USER }}
          PATH_: ${{ secrets.HETZNER_PATH }}
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          missing=
          for name in HOST USER_ PATH_ KEY KNOWN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing secret(s):$missing — see the Deploy section of README.md" >&2
            exit 1
          fi
          case "$PATH_" in
            */) ;;
            *) echo "HETZNER_PATH must end in a slash, or rsync writes a directory named after the source" >&2; exit 1 ;;
          esac

      - name: SSH key and host fingerprint
        env:
          KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Pinning the fingerprint rather than turning StrictHostKeyChecking off:
          # the runner is a fresh machine every time and would otherwise trust
          # whatever answers on that address. Produce the value with
          #   ssh-keyscan -p <port> <host>
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          printf '%s\n' "$KEY"   > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: rsync to the webroot
        env:
          HOST: ${{ secrets.HETZNER_SSH_HOST }}
          USER_: ${{ secrets.HETZNER_SSH_USER }}
          PATH_: ${{ secrets.HETZNER_PATH }}
          PORT: ${{ vars.HETZNER_SSH_PORT || 22 }}
          DRY: ${{ inputs.dry_run == true && '--dry-run' || '' }}
        run: |
          # -rltz, not -a: -a would also try to preserve owner and group, which a
          # shared-hosting login is not allowed to set. --chmod normalises instead,
          # so a file's mode on the server does not depend on the runner's umask.
          #
          # --delete-excluded removes what .deployignore names, so a file that used
          # to ship stops being served the moment it lands on the list.
          rsync -rltz --delete --delete-excluded --itemize-changes $DRY \
            --chmod=D755,F644 \
            --exclude-from=.deployignore \
            -e "ssh -p $PORT -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            ./ "$USER_@$HOST:$PATH_"

      - name: What went out
        if: inputs.dry_run == true
        run: echo '::notice::Dry run — nothing was transferred. Run again with dry_run unchecked to deploy.'
