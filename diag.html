<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- Test 3: if the browser chrome turns GREEN, theme-color drives the toolbar tint. -->
<meta name="theme-color" content="#00cc00">
<title>Backdrop-Diagnose</title>
<style>
/* Test 1: the canvas is MAGENTA. Anything magenta on screen is the root
   background showing through — a real gap, or a region Safari fills itself. */
html{background:#ff00ff}
body{margin:0;font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#fff;background:transparent}

/* Identical to production. */
#backdrop{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:100vh;
  height:100lvh;
  z-index:-1;
  background:url(assets/img/magnolia.jpg) center top/cover no-repeat;
  pointer-events:none;
}
/* Test 2: a LIME strip on the backdrop's own bottom edge. Seeing lime means the
   layer simply ends on screen. Magenta with NO lime means something else paints
   that area and the layer never reaches it. */
#edge{position:absolute;left:0;right:0;bottom:0;height:10px;background:#00ff88}

#out{
  position:fixed;top:0;left:0;right:0;z-index:10;
  background:rgba(0,0,0,.82);padding:10px 12px;
  font-variant-numeric:tabular-nums;white-space:pre;
}
.sec{height:70vh;padding:16px}
.see{background:rgba(239,244,241,.9);color:#231c17;margin:0 16px;padding:24px}
.solid{background:#231c17}
</style>
</head>
<body>
<div id="backdrop" aria-hidden="true"><div id="edge"></div></div>
<div id="out">wird gemessen …</div>

<div class="sec"></div>
<div class="sec"><div class="see">durchsichtiger Block (wie Player / Presse)</div></div>
<div class="sec solid"></div>
<div class="sec"><div class="see">noch ein durchsichtiger Block</div></div>
<div class="sec"></div>
<div class="sec"><div class="see">bis hier runterscrollen und dann ein Foto machen</div></div>
<div class="sec"></div>

<script>
const out = document.getElementById('out');
const probe = document.createElement('div');
probe.style.cssText = 'position:absolute;visibility:hidden;width:0';
document.body.appendChild(probe);
const unit = u => { probe.style.height = '100' + u; return Math.round(parseFloat(getComputedStyle(probe).height)); };
const n = v => String(Math.round(v)).padStart(4);

function read() {
  const vv = window.visualViewport;
  const b = document.getElementById('backdrop').getBoundingClientRect();
  out.textContent = [
    'innerHeight     ' + n(innerHeight),
    'clientHeight    ' + n(document.documentElement.clientHeight),
    'visualViewport  ' + n(vv ? vv.height : 0) + '   offsetTop ' + n(vv ? vv.offsetTop : 0),
    '100vh ' + n(unit('vh')) + '  svh ' + n(unit('svh')) + '  lvh ' + n(unit('lvh')) + '  dvh ' + n(unit('dvh')),
    'backdrop  top ' + n(b.top) + '  hoehe ' + n(b.height) + '  unten ' + n(b.bottom),
    'LUECKE unten    ' + n((vv ? vv.height : innerHeight) - b.bottom) + '  <- entscheidend',
  ].join('\n');
}
addEventListener('scroll', read, { passive: true });
addEventListener('resize', read);
if (window.visualViewport) {
  visualViewport.addEventListener('resize', read);
  visualViewport.addEventListener('scroll', read);
}
read();
setInterval(read, 250);
</script>
</body>
</html>
