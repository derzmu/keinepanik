<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Zaehlt ein Hintergrundbild?</title>
<style>
html{background:#ff00ff}                 /* Wurzel: magenta = "durchgefallen" */
body{margin:0;font:14px/1.4 ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 1px 3px #000}
.b{height:100lvh;display:flex;align-items:flex-end;justify-content:center;
   padding-bottom:10px;font-weight:700;text-align:center}

/* 1 Kontrolle: deckende Farbe. Muss den Streifen gruen faerben. */
.farbe{background:#00c853}

/* 2 Nur ein Hintergrundbild, keine Farbe. Faerbt es den Streifen? */
.bild{background-image:url(assets/img/magnolia.jpg);background-size:cover;background-position:center}

/* 3 Bild UND Farbe. Wenn der Streifen gruen wird, zaehlt nur die Farbe. */
.beides{background-color:#00c853;background-image:url(assets/img/magnolia.jpg);
        background-size:cover;background-position:center}

/* 4 Bild mit fixed — auf iOS als scroll behandelt. Nur zum Sehen, wie es sich verhaelt. */
.fix{background-image:url(assets/img/magnolia.jpg);background-size:cover;
     background-position:center;background-attachment:fixed}
</style>
</head>
<body>
<div class="b farbe">1 · nur Farbe (Kontrolle)<br>Streifen muss GRUEN sein</div>
<div class="b bild">2 · nur Bild<br>Foto oder MAGENTA?</div>
<div class="b beides">3 · Bild + gruene Farbe<br>Foto oder GRUEN?</div>
<div class="b fix">4 · Bild mit attachment:fixed<br>steht es still?</div>
<div class="b farbe">5 · nur Farbe (Kontrolle)</div>
</body>
</html>
