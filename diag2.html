<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Was erreicht das Band?</title>
<style>
/* Wurzelfarbe knallig, damit man sie sofort erkennt. */
html{background:#ff00ff}
body{margin:0;font:14px/1.4 ui-monospace,Menlo,monospace;color:#fff}

/* Genau wie auf der echten Seite: fixiertes Foto hinter allem. */
#foto{position:fixed;top:0;left:0;right:0;height:100lvh;z-index:0;
  display:block;width:100%;object-fit:cover;object-position:center top;pointer-events:none}
main{position:relative;z-index:1}

.b{height:100lvh;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;
   font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.schwarz{background:#000}
.creme{background:#fffcf4;color:#000}
.gruen{background:#00c853}
.durch{background:transparent}          /* nur das Foto */
.halb{background:rgba(239,244,241,.9);color:#000}
</style>
</head>
<body>
<img id="foto" src="assets/img/magnolia.jpg" alt="" aria-hidden="true">
<main>
<div class="b durch">1 · durchsichtig (nur Foto)</div>
<div class="b schwarz">2 · deckend schwarz</div>
<div class="b creme">3 · deckend creme</div>
<div class="b gruen">4 · deckend gruen</div>
<div class="b halb">5 · halbtransparent</div>
<div class="b durch">6 · durchsichtig (nur Foto)</div>
</main>
</body>
</html>
